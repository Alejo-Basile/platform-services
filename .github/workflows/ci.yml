name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d relaxed .

      # Se activa solo cuando existan scripts shell
      - name: shellcheck
        if: hashFiles('**/*.sh') != ''
        run: |
          sudo apt-get install -y shellcheck
          git ls-files '*.sh' -z | xargs -0 shellcheck

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Redocly lint (contrato v2)
        run: npx --yes @redocly/cli@2.66.1 lint openapi/documents.yaml

  rate-limiter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: rate-limiter/go.mod

      - name: Vet y tests
        working-directory: rate-limiter
        run: |
          go vet ./...
          go test ./...

      - name: Build de imagen no-root
        run: docker build -t ratelimitd:ci rate-limiter

      - name: Verificar usuario no-root
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' ratelimitd:ci)"
          test "$user" = "10001:10001" || {
            echo "usuario inesperado: ${user}"
            exit 1
          }
          echo "usuario de imagen: ${user}"
