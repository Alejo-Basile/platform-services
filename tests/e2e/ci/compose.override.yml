# Override exclusivo del E2E de P4.
#
# `minio-notify-init` exige MINIO_ROOT_PASSWORD y MINIO_WEBHOOK_SECRET, pero el
# compose de infra solo le pasa el primero como *_FILE (su script no lo resuelve)
# y declara el segundo unicamente en el servicio `minio`. Sin esta inyeccion el
# job sale con error y no suscribe `raw-pdfs`, por lo que los webhooks nunca
# llegan al doc-service en un checkout limpio.
services:
  minio-notify-init:
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir en .env}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:?definir en .env}

  # `infra` asume que platform-services es un repo hermano (../../platform-services/
  # rate-limiter), pero en el checkout de CI el repo ES la raiz del workspace y
  # rate-limiter vive dentro. Los arneses exportan P4_RATELIMITD_BUILD_CONTEXT
  # con la ruta real; el default mantiene el layout local de repos hermanos.
  ratelimitd:
    build:
      context: ${P4_RATELIMITD_BUILD_CONTEXT:-../../platform-services/rate-limiter}
