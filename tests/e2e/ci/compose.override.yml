# Override exclusivo del E2E de P4.
#
# `minio-notify-init` exige MINIO_WEBHOOK_SECRET para re-aplicar el target, pero
# el compose de infra solo lo declara en el servicio `minio`. Sin esta inyeccion
# el job sale con error y no suscribe `raw-pdfs`, por lo que los webhooks nunca
# llegan al doc-service en un checkout limpio.
services:
  minio-notify-init:
    environment:
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:?definir en .env}
